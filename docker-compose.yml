services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wordgames
      POSTGRES_USER: wordgames
      POSTGRES_PASSWORD: wordgames
    ports:
      - "5432:5432"
    volumes:
      - wordgames-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordgames -d wordgames"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordgames-postgres:
